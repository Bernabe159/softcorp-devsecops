name: SoftCorp DevSecOps Pipeline

# Se ejecuta en cada push y en cada pull request hacia main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ============================================================
  # ETAPA 1: Secret Scanning
  # Detecta credenciales, llaves de API o contraseñas subidas al código
  # ============================================================
  secret-scanning:
    name: "Etapa 1 - Escaneo de Secretos (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Si Gitleaks encuentra un secreto, este job falla y detiene el pipeline

  # ============================================================
  # ETAPA 2: SAST - Análisis Estático de Seguridad del código
  # ============================================================
  sast:
    name: "Etapa 2 - SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/security-audit
        # Bloquea el build si detecta patrones de código inseguro
        # (ej. inyección SQL, uso de eval, credenciales hardcodeadas)

  # ============================================================
  # ETAPA 3: SCA - Análisis de Composición de Software
  # Escanea dependencias de terceros (requirements.txt) en busca de CVEs
  # ============================================================
  sca:
    name: "Etapa 3 - SCA (Trivy)"
    runs-on: ubuntu-latest
    needs: secret-scanning
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Trivy (escaneo de dependencias)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./app"
          severity: "CRITICAL,HIGH"
          exit-code: "1"     # Falla el pipeline si hay vulnerabilidades altas/críticas
          format: "table"

  # ============================================================
  # ETAPA 4: Build final (solo corre si las 3 etapas anteriores pasaron)
  # ============================================================
  build:
    name: "Etapa 4 - Build"
    runs-on: ubuntu-latest
    needs: [sast, sca]
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Confirmar build exitoso
        run: echo "Todas las validaciones de seguridad pasaron. Build autorizado."
